name: Publish automated affiliate blog post

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run publishing pipeline
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          AWIN_ID: ${{ secrets.AWIN_ID }}
          TRADEDOUBLER_ID: ${{ secrets.TRADEDOUBLER_ID }}
          AFFILIATE_SUBID: ${{ secrets.AFFILIATE_SUBID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python main.py

      - name: Commit and push generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts docs/index.html docs/index.json docs/sitemap.xml docs/posts
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: publish automated SEO affiliate post"
          git push
